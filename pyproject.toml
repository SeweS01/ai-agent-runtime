[project]
name = "ai-agent-runtime"
version = "0.1.0"
description = "Provider-agnostic local runtime for supervised AI CLI processes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/sewes-ds/ai-agent-runtime"
Repository = "https://github.com/sewes-ds/ai-agent-runtime.git"
Issues = "https://github.com/sewes-ds/ai-agent-runtime/issues"

[project.scripts]
ai-agent-runtime = "ai_agent_runtime.cli:main"
codex-wrapper = "ai_agent_runtime.wrapper.main:main"
ai-agent-runtime-qualify-upstream = "tools.qualify_telegram_upstream:main"
ai-agent-runtime-qualify-retirement = "tools.qualify_retirement_race:main"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.0",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_runtime", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
